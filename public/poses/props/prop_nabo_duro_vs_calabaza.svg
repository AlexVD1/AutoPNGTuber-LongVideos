<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="scale(1.15)">
    <!-- Mesa rústica moderna -->
    <rect x="-48" y="24" width="96" height="18" rx="3" fill="#78350F" stroke="#111827" stroke-width="4"/>

    <!-- LADO IZQUIERDO: Nabo durísimo con cuchillo doblado (¡CLANG!) -->
    <g transform="translate(-24, 8)">
      <path d="M -16 -10 C -20 8 -8 22 0 26 C 8 22 20 8 16 -10 Z" fill="#94A3B8" stroke="#111827" stroke-width="4"/>
      <!-- Cuchillo doblado rebotando -->
      <g transform="translate(0, -16.00)">
        <path d="M 0 0 L 8 -12 L 14 -10 L 6 0 Z" fill="#CBD5E1" stroke="#111827" stroke-width="2.5"/>
        <rect x="8" y="-22" width="6" height="10" rx="1.5" fill="#1E293B" stroke="#111827" stroke-width="2"/>
      </g>
      <circle cx="0" cy="-14" r="5" fill="#FFE600" stroke="#111827" stroke-width="1.5"/>
      <text x="0" y="-12" font-size="4" font-weight="900" text-anchor="middle" fill="#000000">¡CLANG!</text>
    </g>

    <!-- LADO DERECHO: Calabaza grande, dócil y fácil de cortar -->
    <g transform="translate(24, 6)">
      <ellipse cx="0" cy="4" rx="20" ry="16" fill="#EA580C" stroke="#111827" stroke-width="4"/>
      <ellipse cx="-10" cy="4" rx="8" ry="15" fill="#F97316" stroke="#111827" stroke-width="2.5"/>
      <ellipse cx="10" cy="4" rx="8" ry="15" fill="#F97316" stroke="#111827" stroke-width="2.5"/>
      <polygon points="-6,-1 -2,-1 -4,-6" fill="#FEF08A"/>
      <polygon points="6,-1 2,-1 4,-6" fill="#FEF08A"/>
      <path d="M -8 6 Q 0 14 8 6 Z" fill="#FEF08A" stroke="#111827" stroke-width="2"/>
    </g>

    <rect x="-38" y="-34" width="76" height="12" rx="3" fill="#EA580C" stroke="#111827" stroke-width="2"/>
    <text x="0" y="-25.5" font-family="'Arial Black', sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">DURO NABO vs CALABAZA</text>
  </g>
</svg>