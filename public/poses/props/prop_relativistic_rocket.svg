<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="scale(1.15)">
    <!-- Fondo de espacio curvo con líneas de velocidad relativista -->
    <line x1="-45.00" y1="-20" x2="-27.00" y2="-20" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.75"/><line x1="-17.00" y1="0" x2="1.00" y2="0" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.75"/><line x1="11.00" y1="20" x2="29.00" y2="20" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

    <!-- Fuego y plasma azul de fusión relativista a 0.99c -->
    <polygon points="-46,-6.00 -46,6.00 -22,0" fill="#38BDF8" stroke="#111827" stroke-width="3"/>
    <polygon points="-38,-3.00 -38,3.00 -22,0" fill="#FFFFFF"/>

    <!-- Fuselaje de la nave estelar comprimido por contracción de Lorentz -->
    <path d="M -22 -14 L 14 -14 L 38 0 L 14 14 L -22 14 Z" fill="#E2E8F0" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
    <!-- Franja aerodinámica vibrante -->
    <path d="M -16 -4 L 20 -4 L 28 0 L 20 4 L -16 4 Z" fill="#EF4444" stroke="#111827" stroke-width="2.5"/>

    <!-- Cabina con escudo de plasma frontal para absorber radiación cósmica -->
    <polygon points="10,-6 24,-6 32,0 24,6 10,6" fill="#38BDF8" stroke="#111827" stroke-width="3"/>
    <circle cx="18" cy="0" r="3" fill="#FFFFFF"/>

    <!-- Aletas estabilizadoras hiperespaciales -->
    <polygon points="-18,-14 -8,-24 4,-14" fill="#FACC15" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-18,14 -8,24 4,14" fill="#FACC15" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>

    <!-- Medidor digital de factor Lorentz -->
    <rect x="-34" y="26" width="68" height="14" rx="3" fill="#0F172A" stroke="#111827" stroke-width="2.5"/>
    <text x="0" y="36" font-family="'Arial Black', sans-serif" font-size="6.8" font-weight="900" fill="#FACC15" text-anchor="middle">v = 0.99c | γ = 7.1x</text>
  </g>
</svg>