    <!-- 4 pares de patas robustas (8 patas) con garras retráctiles triples -->
    
      <g transform="translate(-26, 16) rotate(0.00)">
        <path d="M 0 0 L -2 12 Q 0 16 4 16 L 6 12 Z" fill="#F59E0B" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M 0 14 L -4 20 M 3 15 L 2 22 M 6 14 L 8 20" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(-10, 16) rotate(0.00)">
        <path d="M 0 0 L -2 12 Q 0 16 4 16 L 6 12 Z" fill="#F59E0B" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M 0 14 L -4 20 M 3 15 L 2 22 M 6 14 L 8 20" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(8, 16) rotate(0.00)">
        <path d="M 0 0 L -2 12 Q 0 16 4 16 L 6 12 Z" fill="#F59E0B" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M 0 14 L -4 20 M 3 15 L 2 22 M 6 14 L 8 20" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(26, 16) rotate(0.00)">
        <path d="M 0 0 L -2 12 Q 0 16 4 16 L 6 12 Z" fill="#F59E0B" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M 0 14 L -4 20 M 3 15 L 2 22 M 6 14 L 8 20" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
      </g>

    <!-- Cuerpo cilíndrico gordinflón con 4 pliegues segmentados tipo acordeón -->
    <path d="M -36 -4 C -36 -24 36 -24 36 -4 C 36 22 -36 22 -36 -4 Z" fill="#FBBF24" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
    <path d="M -18 -20 C -18 0 -18 10 -20 18" stroke="#D97706" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 0 -22 C 0 0 0 10 -2 20" stroke="#D97706" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 18 -20 C 18 0 18 10 16 18" stroke="#D97706" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Cabeza y cono bucal redondeado con estiletes telescópicos -->
    <circle cx="34" cy="-2" r="14" fill="#F59E0B" stroke="#111827" stroke-width="4.5"/>
    <ellipse cx="44" cy="-2" rx="4" ry="7" fill="#78350F" stroke="#111827" stroke-width="3"/>
    <circle cx="44" cy="-2" r="2.5" fill="#EF4444"/>
    <circle cx="33" cy="-7" r="2" fill="#111827"/>
    <circle cx="33" cy="3" r="2" fill="#111827"/>

    <!-- Destellos de resistencia cósmica extrema -->
    <polygon points="-42,-22 -38,-22 -36,-26 -38,-30 -42,-30 -44,-26" fill="#67E8F9" stroke="#111827" stroke-width="1.5"/>
    <polygon points="38,-28 42,-28 44,-32 42,-36 38,-36 36,-32" fill="#67E8F9" stroke="#111827" stroke-width="1.5"/>
