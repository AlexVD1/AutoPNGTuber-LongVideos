<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="scale(1.15)">
    <!-- Árbol medieval estilizado con copa y ramas -->
    <path d="M -18 42 L -12 -10 L -38 -34 L -22 -38 L -6 -18 L 8 -36 L 22 -32 L 6 -12 L 18 42 Z" fill="#3E1A08" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="-32" cy="-38" r="16" fill="#15803D" stroke="#111827" stroke-width="4"/>
    <circle cx="18" cy="-38" r="18" fill="#15803D" stroke="#111827" stroke-width="4"/>
    <circle cx="-4" cy="-46" r="20" fill="#166534" stroke="#111827" stroke-width="4"/>

    <!-- Cruces santas talladas resplandecientes en el tronco -->
    <g transform="translate(0, 14)">
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
      <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="-4" r="12" fill="none" stroke="#FACC15" stroke-width="2" stroke-dasharray="4 3" opacity="0.70"/>
    </g>

    <!-- Diablo rojo miniatura atrapado arriba pataleando -->
    <g transform="translate(-2.00, -36) scale(0.7)">
      <circle cx="0" cy="0" r="14" fill="#DC2626" stroke="#111827" stroke-width="4"/>
      <!-- Cuernos rojos -->
      <polygon points="-8,-12 -14,-24 -4,-14" fill="#DC2626" stroke="#111827" stroke-width="2.5"/>
      <polygon points="8,-12 14,-24 4,-14" fill="#DC2626" stroke="#111827" stroke-width="2.5"/>
      <circle cx="-4" cy="-2" r="2.5" fill="#FEF08A"/>
      <circle cx="4" cy="-2" r="2.5" fill="#FEF08A"/>
      <!-- Boca furiosa -->
      <path d="M -6 6 Q 0 0 6 6" stroke="#111827" stroke-width="3" fill="none"/>
      <!-- Manos de queja -->
      <line x1="-12" y1="4" x2="-22" y2="-8" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="4" x2="22" y2="-8" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
    </g>

    <rect x="-38" y="44" width="76" height="12" rx="3" fill="#DC2626" stroke="#111827" stroke-width="2"/>
    <text x="0" y="52.5" font-family="'Arial Black', sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">¡DIABLO ATRAPADO!</text>
  </g>
</svg>