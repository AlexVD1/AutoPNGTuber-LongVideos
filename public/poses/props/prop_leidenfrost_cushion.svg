<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="scale(1.12)">
    <!-- Marco contenedor de infografía científica -->
    <rect x="-48" y="-46" width="96" height="92" rx="6" fill="#0F172A" stroke="#111827" stroke-width="4.5"/>

    <!-- Capa inferior: Mar de Lava a 1,200 °C -->
    <rect x="-44" y="14" width="88" height="26" fill="#EA580C" stroke="#111827" stroke-width="3"/>
    <path d="M -44 14 Q -22 10.00 0 14 Q 22 18.00 44 14" stroke="#FEF08A" stroke-width="4" fill="none"/>
    <text x="0" y="32" font-family="'Arial Black', sans-serif" font-size="7" font-weight="900" fill="#FEF08A" text-anchor="middle">LAVA 1,200 °C</text>

    <!-- Capa intermedia: Colchón de vapor Leidenfrost oscilante -->
    <path d="M -42 2.00 Q -21 -1.00 0 2.00 Q 21 5.00 42 2.00" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M -42 2.00 Q -21 -1.00 0 2.00 Q 21 5.00 42 2.00" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Flechas térmicas de rechazo hacia arriba -->
    <path d="M -26 -4.00 L -26 -12.00 M -29 -9.00 L -26 -13.00 L -23 -9.00" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 26 -4.00 L 26 -12.00 M 23 -9.00 L 26 -13.00 L 29 -9.00" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Capa superior: Bota / Tejido orgánico suspendido sin tocar la lava -->
    <g transform="translate(0, -18)">
      <!-- Bota aislada flotando en el vapor -->
      <path d="M -16 -12 L -6 -12 L -6 2 L 18 2 L 18 10 L -16 10 Z" fill="#F8FAFC" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="-12" y1="10" x2="16" y2="10" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Etiqueta superior del fenómeno -->
    <rect x="-42" y="-42" width="84" height="13" rx="3" fill="#0284C7" stroke="#111827" stroke-width="2.5"/>
    <text x="0" y="-33" font-family="'Arial Black', sans-serif" font-size="5.8" font-weight="900" fill="#FFFFFF" text-anchor="middle">EFECTO LEIDENFROST</text>
  </g>
</svg>