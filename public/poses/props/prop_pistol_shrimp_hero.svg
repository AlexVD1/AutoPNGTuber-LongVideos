<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="scale(1.15)">
    <!-- Cuerpo de camarón crustáceo curvado con caparazón y cola abanico -->
    <path d="M -42 12 Q -30 20 -16 16 Q 0 12 12 18" stroke="#F97316" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M -46 8 L -36 12 L -48 18" stroke="#111827" stroke-width="3.5" fill="#FB923C"/>
    <!-- Antenas sensoriales largas ondulando -->
    <path d="M 8 10 Q 22 -6 32 -18" stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 12 12 Q 28 4 42 0" stroke="#111827" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Pinza izquierda normal pequeña -->
    <path d="M -4 18 L 8 26 L 14 22" stroke="#111827" stroke-width="3.5" fill="#F97316"/>

    <!-- MEGA PINZA DERECHA GIGANTE DE PISTOLA -->
    <!-- Base bulbosa de la pinza con resorte muscular -->
    <path d="M -12 6 C -12 -16 16 -24 24 -4 C 28 8 10 22 -10 16 Z" fill="#EF4444" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="6" cy="-2" rx="12" ry="7" fill="#DC2626"/>

    <!-- Dedo fijo inferior con cavidad acústica -->
    <path d="M 18 2 L 38 6 L 30 16 L 14 12 Z" fill="#B91C1C" stroke="#111827" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Martillo percutor móvil superior con resorte elástico -->
    <g transform="translate(14, -8) rotate(-35)">
      <path d="M 0 0 L 26 -12 L 28 4 L 0 6 Z" fill="#F97316" stroke="#111827" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="8" cy="-2" r="3" fill="#FFE600"/>
    </g>

    <!-- Ojo en tallo bulboso -->
    <circle cx="4" cy="8" r="4.5" fill="#F8FAFC" stroke="#111827" stroke-width="2.5"/>
    <circle cx="5" cy="8" r="2.2" fill="#111827"/>

    <!-- Destello de cavitación y plasma a 4,700 K al cerrarse el martillo -->
    
  </g>
</svg>