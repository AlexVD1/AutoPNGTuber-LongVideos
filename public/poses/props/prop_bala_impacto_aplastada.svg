<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="scale(1.15)">
    <!-- Estelas de velocidad de la bala en vuelo supersónico -->
    <line x1="-70" y1="-5" x2="-54" y2="-5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="-76" y1="0" x2="-54" y2="0" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" />
    <line x1="-70" y1="5" x2="-54" y2="5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Gota de Rupert inamovible (cabeza a la derecha recibiendo el impacto) -->
    <g transform="translate(6, 0)">
      <path d="M -4 0 C -4 -18 16 -22 32 -6 C 44 4 52 2 58 -6 C 54 8 40 18 22 18 C 6 18 -4 12 -4 0 Z" fill="#E0F2FE" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
      <path d="M 0 -4 C 0 -12 12 -14 22 -4" fill="#FFFFFF" opacity="0.85" />
      <circle cx="58" cy="-6" r="2.5" fill="#EF4444" stroke="#111827" stroke-width="1.2" />
    </g>

    <!-- Bala metálica realista (proyectil cobrizo con estrías) -->
    <g transform="translate(-6, 0)">
      <!-- Cuerpo cilíndrico del proyectil de latón/cobre -->
      <rect x="-48" y="-7" width="26" height="14" rx="2" fill="#D97706" stroke="#111827" stroke-width="3.5" />
      <line x1="-36" y1="-7" x2="-36" y2="7" stroke="#78350F" stroke-width="2" />
      <line x1="-42" y1="-7" x2="-42" y2="7" stroke="#78350F" stroke-width="2" />
      
      <!-- Ojiva aerodinámica de la bala -->
      <path d="M -22 -7 C -14 -7 -6 -4 0 0 C -6 4 -14 7 -22 7 Z" fill="#F59E0B" stroke="#111827" stroke-width="3.5" />
      
      <!-- Núcleo de plomo aplastado y deformado contra el cristal (mushrooming) -->
      <path d="M 0 -11 C 2 -5 2 5 0 11 L -4 7 L -2 0 L -4 -7 Z" fill="#64748B" stroke="#111827" stroke-width="2.5" />
      
      <!-- Esquirlas y fragmentos de camisa de cobre saliendo disparados -->
      <polygon points="-8,-11 -2,-17 -6,-8" fill="#F59E0B" stroke="#111827" stroke-width="1.5" />
      <polygon points="-8,11 -2,17 -6,8" fill="#F59E0B" stroke="#111827" stroke-width="1.5" />
      <polygon points="0,-14 6,-18 2,-9" fill="#94A3B8" stroke="#111827" stroke-width="1.5" />
      <polygon points="0,14 6,18 2,9" fill="#94A3B8" stroke="#111827" stroke-width="1.5" />
    </g>

    <!-- Destello explosivo de choque y chispas al momento de la colisión -->
    <g transform="translate(-6, 0) scale(0.80)">
      <circle cx="0" cy="0" r="7" fill="#FEF08A" opacity="0.95" />
      <polygon points="0,-4 8,-16 2,-8 6,-24 -3,-10 -9,-16 -4,-4" fill="#FACC15" stroke="#111827" stroke-width="1.5" />
      <polygon points="0,4 8,16 2,8 6,24 -3,10 -9,16 -4,4" fill="#EF4444" stroke="#111827" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8.00" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="4 4" opacity="1.00" />
    </g>

    <rect x="-42" y="32" width="84" height="12" rx="3" fill="#DC2626" stroke="#111827" stroke-width="2"/>
    <text x="0" y="40.5" font-family="'Arial Black', sans-serif" font-size="5.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">¡BALA APLASTADA 100%!</text>
  </g>
</svg>