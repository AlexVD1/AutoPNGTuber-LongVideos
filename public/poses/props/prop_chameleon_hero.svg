<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="scale(1.15)">
    <!-- Rama leñosa con hojas tropicales alineada al punto de agarre de la mano (y: 14) -->
    <rect x="-46" y="10" width="92" height="11" rx="4" fill="#78350F" stroke="#111827" stroke-width="4.5"/>
    <path d="M -42 13 L 42 13" stroke="#92400E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -34 10 Q -42 0 -36 -6 Q -28 0 -34 10" fill="#22C55E" stroke="#111827" stroke-width="3"/>
    <path d="M 36 10 Q 44 0 38 -6 Q 30 0 36 10" fill="#10B981" stroke="#111827" stroke-width="3"/>

    <!-- Cola prensil enrollada en espiral continua (característica única del camaleón) -->
    <path d="M -18 2 C -30 -4 -46 2 -44 18 C -42 32 -22 34 -18 20 C -16 10 -30 10 -32 18 C -33 22 -26 24 -24 20" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -18 2 C -30 -4 -46 2 -44 18 C -42 32 -22 34 -18 20 C -16 10 -30 10 -32 18 C -33 22 -26 24 -24 20" fill="none" stroke="hsl(150.00, 88%, 48%)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Espinas dorsales triangulares afiladas a lo largo de la columna vertebral -->
    <polygon points="-16,-15 -13,-22 -10,-17" fill="hsl(185.00, 92%, 55%)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="-9,-21 -6,-28 -3,-23" fill="hsl(185.00, 92%, 55%)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="-2,-24 1,-31 4,-25" fill="hsl(185.00, 92%, 55%)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="5,-24 8,-30 11,-23" fill="hsl(185.00, 92%, 55%)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="12,-20 15,-25 18,-18" fill="hsl(185.00, 92%, 55%)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>

    <!-- Cuerpo comprimido lateralmente en forma de hoja -->
    <path d="M -20 8 C -22 -16 6 -28 20 -16 C 30 -6 24 14 -18 12 Z" fill="hsl(150.00, 88%, 48%)" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>

    <!-- Patrones bandeados de interferencia fotónica iridiscente -->
    <path d="M -10 -16 L -14 8" stroke="hsl(185.00, 92%, 55%)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -2 -22 L -6 8" stroke="hsl(185.00, 92%, 55%)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 6 -20 L 2 8" stroke="hsl(185.00, 92%, 55%)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Casco o cresta occipital elevada (casque) en la parte superior de la cabeza -->
    <path d="M 8 -18 C 8 -34 22 -36 28 -20 C 29 -15 26 -14 20 -15 Z" fill="hsl(126.00, 82%, 36%)" stroke="#111827" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 12 -28 C 16 -32 22 -30 24 -20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65" fill="none"/>

    <!-- Hocico reptiliano con línea de boca y orificio nasal -->
    <path d="M 16 -20 L 36 -8 L 28 4 L 14 0 Z" fill="hsl(150.00, 88%, 48%)" stroke="#111827" stroke-width="4.5" stroke-linejoin="round"/>
    <line x1="28" y1="-4" x2="36" y2="-8" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <circle cx="33" cy="-10" r="1.5" fill="#111827"/>

    <!-- Lengua que dispara hacia adelante -->
    

    <!-- Ojo en torreta cónica prominente con visión 360 -->
    <circle cx="18" cy="-12" r="9.5" fill="hsl(185.00, 92%, 55%)" stroke="#111827" stroke-width="4"/>
    <circle cx="18" cy="-12" r="6.5" fill="hsl(150.00, 88%, 48%)" stroke="#111827" stroke-width="2.5"/>
    <circle cx="21.20" cy="-12.00" r="3.2" fill="#111827"/>
    <circle cx="22.10" cy="-12.90" r="1.2" fill="#FFFFFF"/>

    <!-- Patas con pinzas cigodáctilas abrazando firmemente la rama -->
    <path d="M -10 6 L -14 13 M -10 6 L -8 13 M -16 15 Q -12 18 -6 15" stroke="#111827" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="-11" cy="9" r="4.5" fill="hsl(126.00, 82%, 36%)" stroke="#111827" stroke-width="2.5"/>
    <path d="M 12 4 L 8 13 M 12 4 L 14 13 M 6 15 Q 10 18 16 15" stroke="#111827" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="11" cy="8" r="4.5" fill="hsl(126.00, 82%, 36%)" stroke="#111827" stroke-width="2.5"/>
  </g>
</svg>