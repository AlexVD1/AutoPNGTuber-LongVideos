<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="scale(1.15)">
    <!-- Base neo-brutalista con curvatura espacio-temporal de Einstein -->
    <rect x="-48" y="-44" width="96" height="88" rx="8" fill="#0B132B" stroke="#111827" stroke-width="5"/>
    
    <!-- Malla de gravedad curvada en el centro -->
    <path d="M -44 0 Q 0 28 44 0 M -44 -14 Q 0 16 44 -14 M -44 14 Q 0 38 44 14" stroke="#1E293B" stroke-width="2" fill="none"/>
    <line x1="0" y1="-44" x2="0" y2="44" stroke="#111827" stroke-width="3.5" stroke-dasharray="4 4"/>

    <!-- Reloj Izquierdo: Superficie (Gravedad menor -> Tiempo corre MÁS RÁPIDO) -->
    <g transform="translate(-24, -8)">
      <circle cx="0" cy="0" r="18" fill="#0284C7" stroke="#111827" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="#38BDF8"/>
      <!-- Manecilla rápida girando -->
      <g transform="rotate(0.00)">
        <line x1="0" y1="0" x2="0" y2="-11" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="7" y2="0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
      </g>
      <circle cx="0" cy="0" r="2.5" fill="#111827"/>
      <text x="0" y="27" font-family="'Arial Black', sans-serif" font-size="6" font-weight="900" fill="#38BDF8" text-anchor="middle">SUPERFICIE</text>
      <text x="0" y="34" font-family="'Arial Black', sans-serif" font-size="5" font-weight="900" fill="#BAE6FD" text-anchor="middle">+ RÁPIDO</text>
    </g>

    <!-- Reloj Derecho: Núcleo Terrestre (Pozo gravitatorio profundo -> Tiempo MÁS LENTO) -->
    <g transform="translate(24, -8)">
      <circle cx="0" cy="0" r="18" fill="#B45309" stroke="#111827" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="#F59E0B"/>
      <!-- Manecilla lenta -->
      <g transform="rotate(0.00)">
        <line x1="0" y1="0" x2="0" y2="-9" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="5" y2="0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
      </g>
      <circle cx="0" cy="0" r="2.5" fill="#111827"/>
      <text x="0" y="27" font-family="'Arial Black', sans-serif" font-size="6" font-weight="900" fill="#FBBF24" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="34" font-family="'Arial Black', sans-serif" font-size="5.5" font-weight="900" fill="#FEF08A" text-anchor="middle">- 2.5 AÑOS</text>
    </g>

    <!-- Rótulo superior de relatividad general -->
    <rect x="-38" y="-40" width="76" height="13" rx="3" fill="#FFE600" stroke="#111827" stroke-width="2.5"/>
    <text x="0" y="-31" font-family="'Arial Black', sans-serif" font-size="6.5" font-weight="900" fill="#111827" text-anchor="middle">DILATACIÓN TEMPORAL</text>
  </g>
</svg>