    <line key="-30" x1="-30" y1="8" x2="-30" y2="48" stroke="#111827" stroke-width="3.5"/><line key="-15" x1="-15" y1="8" x2="-15" y2="48" stroke="#111827" stroke-width="3.5"/><line key="0" x1="0" y1="8" x2="0" y2="48" stroke="#111827" stroke-width="3.5"/><line key="15" x1="15" y1="8" x2="15" y2="48" stroke="#111827" stroke-width="3.5"/><line key="30" x1="30" y1="8" x2="30" y2="48" stroke="#111827" stroke-width="3.5"/>
